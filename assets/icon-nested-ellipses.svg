<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e3a5f"/>
    </linearGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="url(#bg2)"/>

  <!-- Faint graticule -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#38bdf8" stroke-width="0.5" opacity="0.08"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="#38bdf8" stroke-width="0.5" opacity="0.06"/>
  <circle cx="256" cy="256" r="100" fill="none" stroke="#38bdf8" stroke-width="0.5" opacity="0.04"/>

  <!-- Ellipse 1: nearly circular (low distortion) — inner -->
  <ellipse cx="256" cy="256" rx="65" ry="60" fill="#10b981" fill-opacity="0.06" stroke="#10b981" stroke-width="3.5" filter="url(#glow2)" opacity="0.9" transform="rotate(-5, 256, 256)"/>

  <!-- Ellipse 2: moderate stretch (medium distortion) — middle -->
  <ellipse cx="256" cy="256" rx="120" ry="80" fill="#f59e0b" fill-opacity="0.04" stroke="#f59e0b" stroke-width="3" filter="url(#glow2)" opacity="0.8" transform="rotate(15, 256, 256)"/>

  <!-- Ellipse 3: heavy stretch (high distortion) — outer -->
  <ellipse cx="256" cy="256" rx="190" ry="95" fill="#ef4444" fill-opacity="0.03" stroke="#ef4444" stroke-width="2.5" filter="url(#glow2)" opacity="0.7" transform="rotate(-10, 256, 256)"/>

  <!-- Center dot -->
  <circle cx="256" cy="256" r="6" fill="white" opacity="0.7"/>

  <!-- Axis lines through center -->
  <line x1="256" y1="140" x2="256" y2="372" stroke="white" stroke-width="1" opacity="0.12"/>
  <line x1="140" y1="256" x2="372" y2="256" stroke="white" stroke-width="1" opacity="0.12"/>

  <!-- Text -->
  <text x="256" y="458" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="700" fill="white" opacity="0.8" letter-spacing="8">TISSOT</text>
</svg>
