name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-wheels:
    name: Build wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          args: --release --out dist
          sccache: true

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: dist

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build-wheels
    permissions:
      id-token: write

    steps:
      - name: Download wheel artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: wheels-*
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  package-qgis-plugin:
    name: Package QGIS plugin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build plugin zip
        shell: bash
        run: |
          cd python/tissot/qgis_plugin
          bash package_plugin.sh

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: qgis-plugin
          path: python/tissot/qgis_plugin/dist/*.zip

  publish-github-release:
    name: Publish GitHub release assets
    runs-on: ubuntu-latest
    needs: [build-wheels, package-qgis-plugin]

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/wheels-ubuntu-latest/*
            artifacts/wheels-macos-14/*
            artifacts/wheels-windows-latest/*
            artifacts/qgis-plugin/*.zip
